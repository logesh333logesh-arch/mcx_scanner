# Save this as: .github/workflows/mcx_scanner.yml
# MCX runs 9:00 AM to 11:30/11:55 PM IST depending on session (US DST).
# Cron below covers ~9:15 AM to 11:30 PM IST, every 15 min, Mon-Fri.
# GitHub Actions cron is in UTC â€” IST = UTC+5:30.

name: MCX Scanner (Scanner-3)

on:
  schedule:
    - cron: "45 3 * * 1-5"   # 9:15 AM IST
    - cron: "*/15 4-17 * * 1-5"  # every 15 min, ~9:30 AM - 11:30 PM IST window (adjust as needed)
  workflow_dispatch: {}   # allows manual "Run workflow" trigger too

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      # NOTE: manual_login.py as written takes an interactive input() paste
      # of the redirected URL/code â€” this step needs whatever automated
      # TOTP + redirect-capture approach you're already using for Scanner-4
      # (e.g. a headless browser script that logs in with UPSTOX_TOTP_SECRET
      # and captures the code automatically). Swap this step for that script;
      # the key requirement is that token.txt exists before the next step runs.
      - name: Manual login (generate Upstox access token -> token.txt)
        env:
          UPSTOX_API_KEY: ${{ secrets.UPSTOX_API_KEY }}
          UPSTOX_API_SECRET: ${{ secrets.UPSTOX_API_SECRET }}
          UPSTOX_TOTP_SECRET: ${{ secrets.UPSTOX_TOTP_SECRET }}
        run: python manual_login.py   # reuse your existing Scanner-4 automated-login variant here

      - name: Download instrument master
        run: |
          mkdir -p instruments
          curl -s -o instruments/mcx_instruments.csv.gz \
            https://assets.upstox.com/market-quote/instruments/exchange/MCX.csv.gz
          gunzip -f instruments/mcx_instruments.csv.gz

      - name: Run MCX scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python mcx_scanner_main.py   # reads token.txt via manual_login.load_token()
