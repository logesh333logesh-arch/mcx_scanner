# Save this as: .github/workflows/mcx_scanner.yml
# MCX runs 9:00 AM to 11:30/11:55 PM IST depending on session (US DST).
# Cron below covers ~9:15 AM to 11:30 PM IST, every 15 min, Mon-Fri.
# GitHub Actions cron is in UTC â€” IST = UTC+5:30.
#
# AUTH MODEL (same as Scanner-4):
# manual_login.py needs a human to click through TOTP login, which can't
# run inside GitHub Actions. So the daily flow is:
#   1. Each morning (before market open), run `python manual_login.py`
#      locally/Termux â€” this writes token.txt
#   2. Commit + push token.txt to this repo (git add token.txt && git commit
#      -m "token" && git push) â€” every scheduled run below just reads that
#      already-generated token.txt, no login step needed in Actions.
#   3. Repeat step 1-2 every trading day before market opens (token expires
#      daily ~3:30 AM IST regardless of when it was generated).

name: MCX Scanner (Scanner-3)

on:
  schedule:
    - cron: "45 3 * * 1-5"   # 9:15 AM IST
    - cron: "*/15 4-17 * * 1-5"  # every 15 min, ~9:30 AM - 11:30 PM IST window (adjust as needed)
  workflow_dispatch: {}   # allows manual "Run workflow" trigger too

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # pulls token.txt as committed this morning

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Download instrument master
        run: |
          mkdir -p instruments
          curl -s -o instruments/mcx_instruments.csv.gz \
            https://assets.upstox.com/market-quote/instruments/exchange/MCX.csv.gz
          gunzip -f instruments/mcx_instruments.csv.gz

      - name: Run MCX scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python mcx_scanner_main.py   # reads token.txt via manual_login.load_token()
